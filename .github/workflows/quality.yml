name: Quality Gate

# Asserts REAL model quality on REAL data with NO secrets. cc-default is on
# OpenML (no auth required), so CI can download it and enforce the dataset's
# published benchmark gate (roc_auc >= 0.74, avg_precision >= 0.50, recall >=
# 0.55, precision >= 0.28). This complements the synthetic e2e smoke, which only
# checks plumbing: here a model that regresses below the bar fails the build.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      MLOPS_DATASET: cc-default
      MLFLOW_TRACKING_URI: ${{ format('sqlite:///{0}/mlflow.db', github.workspace) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies (pinned lock + editable package)
        run: |
          pip install -r requirements.lock
          pip install -e . --no-deps

      - name: Train on real data (cc-default via OpenML, no auth)
        run: |
          python -m src.data.download
          python -m src.data.validate
          python -m src.data.preprocess
          python -m src.models.train

      - name: Enforce the real benchmark gate (fails the build on regression)
        run: python -m src.models.evaluate --stage holdout

      # Cross-validated gate. The single-split gate above is noisy in proportion
      # to how rare the positive class is: on the creditcard profile 13 of 25 CV
      # folds miss a target that the fold *mean* clears (see
      # metrics/creditcard/cv_metrics.json), because the recall floor can drag a
      # fold's tuned threshold toward zero and collapse precision. Gating on the
      # mean removes that failure mode without weakening the bar.
      #
      # One seed (5 folds, ~20s on cc-default) keeps PR feedback fast while
      # still averaging five models instead of trusting one split. The full
      # 5-seed / 25-model run is what produced the committed artifacts:
      #   python scripts/cv_evaluate.py --folds 5 --seeds 42,7,21,123,1
      - name: Enforce the cross-validated gate (fold mean, not a single split)
        run: python scripts/cv_evaluate.py --folds 5 --seeds 42 --gate

      - name: Publish metrics to the run summary
        if: always()
        run: |
          {
            echo "## cc-default quality gate"
            echo '```json'
            cat metrics/cc-default/eval_metrics.json 2>/dev/null || echo "(no metrics)"
            echo '```'
            echo "## cross-validated gate (fold mean over 5 folds)"
            echo '```json'
            python -c "import json;d=json.load(open('metrics/cc-default/cv_metrics.json'));print(json.dumps({'n_models':d['n_models'],'summary':d['summary']},indent=2))" 2>/dev/null || echo "(no cv metrics)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
