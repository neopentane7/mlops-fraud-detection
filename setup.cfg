[tool:pytest]
testpaths = tests
asyncio_mode = auto
addopts = -ra
# No pythonpath hack needed: the package is installed editable (pip install -e .),
# so `import src...` / `import api...` resolve without PYTHONPATH.

[coverage:run]
# Both packages: api/ holds the middleware, auth, rate limiting and audit-log
# code and was previously excluded from the gate entirely.
source =
    src
    api
omit =
    src/__init__.py
    src/**/__init__.py
    tests/*

[coverage:report]
fail_under = 80
show_missing = True
